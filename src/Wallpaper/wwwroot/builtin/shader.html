<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BeeX Nebula Shader</title>
<style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="../runtime.js"></script>
<script>
// Audio-reactive nebula: WebGPU first, WebGL2 fallback (same effect in WGSL and GLSL).
// Uniforms: time, resolution, pointer, 4 averaged audio bands (low/mid-low/mid-high/high) + beat pulse.
const canvas = document.getElementById('c');
const W = window.BeeXWallpaper;
let beatPulse = 0;
const bands4 = new Float32Array(4);
W.onAudio((bands, beat) => {
  for (let g = 0; g < 4; g++) {
    let s = 0;
    for (let i = 0; i < 16; i++) s += bands[g * 16 + i];
    bands4[g] = s / 16;
  }
  if (beat) beatPulse = 1;
});

function fit() {
  canvas.width = Math.max(1, Math.floor(innerWidth * devicePixelRatio));
  canvas.height = Math.max(1, Math.floor(innerHeight * devicePixelRatio));
}
fit(); addEventListener('resize', fit);

const WGSL = `
struct U { t:f32, beat:f32, rx:f32, ry:f32, px:f32, py:f32, pad0:f32, pad1:f32, a:vec4<f32> };
@group(0) @binding(0) var<uniform> u:U;
@vertex fn vs(@builtin(vertex_index) i:u32) -> @builtin(position) vec4<f32> {
  var p = array<vec2<f32>,3>(vec2(-1.0,-3.0), vec2(3.0,1.0), vec2(-1.0,1.0));
  return vec4(p[i],0.0,1.0);
}
fn h(p:vec2<f32>) -> f32 { return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
fn n2(p:vec2<f32>) -> f32 {
  let i=floor(p); let f=fract(p); let w=f*f*(3.0-2.0*f);
  return mix(mix(h(i),h(i+vec2(1.0,0.0)),w.x), mix(h(i+vec2(0.0,1.0)),h(i+vec2(1.0,1.0)),w.x), w.y);
}
fn fbm(p0:vec2<f32>) -> f32 {
  var p=p0; var v=0.0; var a=0.5;
  for (var i=0; i<5; i++) { v+=a*n2(p); p=p*2.03+vec2(1.7,9.2); a*=0.5; }
  return v;
}
@fragment fn fs(@builtin(position) frag:vec4<f32>) -> @location(0) vec4<f32> {
  let res=vec2(u.rx,u.ry);
  var uv=(frag.xy-0.5*res)/res.y;
  let pt=vec2(u.px,u.py)-vec2(0.5);
  uv+=pt*0.15;
  let t=u.t*0.05;
  let q=vec2(fbm(uv*2.0+t), fbm(uv*2.0-t*0.7));
  let r=vec2(fbm(uv*3.0+q*1.6+u.a.x*2.0), fbm(uv*3.0-q*1.2+t));
  let f=fbm(uv*2.5+r*2.0);
  var col=mix(vec3(0.05,0.02,0.12), vec3(0.55,0.12,0.45), f*f*2.2);
  col=mix(col, vec3(1.0,0.55,0.1), clamp(q.x*u.a.x*2.2,0.0,1.0));
  col=mix(col, vec3(0.15,0.55,0.9), clamp(r.y*u.a.z*1.8,0.0,1.0));
  col+=vec3(1.0,0.8,0.5)*u.beat*0.22*f;
  col+=u.a.w*0.15*vec3(0.4,0.5,1.0)*n2(uv*40.0+t*20.0);
  return vec4(pow(col,vec3(0.9)),1.0);
}`;

const GLSL_F = `#version 300 es
precision highp float;
uniform float t,beat; uniform vec2 res,ptr; uniform vec4 a;
out vec4 o;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p),w=f*f*(3.-2.*f);
  return mix(mix(h(i),h(i+vec2(1,0)),w.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),w.x),w.y);}
float fbm(vec2 p){float v=0.,amp=.5;for(int i=0;i<5;i++){v+=amp*n2(p);p=p*2.03+vec2(1.7,9.2);amp*=.5;}return v;}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*res)/res.y;
  uv+=(ptr-vec2(.5))*.15;
  float tt=t*.05;
  vec2 q=vec2(fbm(uv*2.+tt),fbm(uv*2.-tt*.7));
  vec2 r=vec2(fbm(uv*3.+q*1.6+a.x*2.),fbm(uv*3.-q*1.2+tt));
  float f=fbm(uv*2.5+r*2.);
  vec3 col=mix(vec3(.05,.02,.12),vec3(.55,.12,.45),f*f*2.2);
  col=mix(col,vec3(1.,.55,.1),clamp(q.x*a.x*2.2,0.,1.));
  col=mix(col,vec3(.15,.55,.9),clamp(r.y*a.z*1.8,0.,1.));
  col+=vec3(1.,.8,.5)*beat*.22*f;
  col+=a.w*.15*vec3(.4,.5,1.)*n2(uv*40.+tt*20.);
  o=vec4(pow(col,vec3(.9)),1.);
}`;

async function startWebGpu() {
  if (!navigator.gpu) return false;
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) return false;
  const device = await adapter.requestDevice();
  const ctx = canvas.getContext('webgpu');
  const format = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format, alphaMode: 'opaque' });
  const module = device.createShaderModule({ code: WGSL });
  const pipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module, entryPoint: 'vs' },
    fragment: { module, entryPoint: 'fs', targets: [{ format }] },
    primitive: { topology: 'triangle-list' },
  });
  const ubo = device.createBuffer({ size: 48, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const bind = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: ubo } }] });
  const data = new Float32Array(12);
  W.onTime((dt, t) => {
    beatPulse = Math.max(0, beatPulse - dt * 3);
    data[0] = t; data[1] = beatPulse;
    data[2] = canvas.width; data[3] = canvas.height;
    data[4] = W.pointer.x; data[5] = W.pointer.y;
    data.set(bands4, 8);
    device.queue.writeBuffer(ubo, 0, data);
    const enc = device.createCommandEncoder();
    const pass = enc.beginRenderPass({ colorAttachments: [{ view: ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
    pass.setPipeline(pipeline); pass.setBindGroup(0, bind); pass.draw(3); pass.end();
    device.queue.submit([enc.finish()]);
  });
  return true;
}

function startWebGl2() {
  const gl = canvas.getContext('webgl2');
  if (!gl) return false;
  const vsSrc = `#version 300 es\nvoid main(){vec2 p[3]=vec2[3](vec2(-1.,-3.),vec2(3.,1.),vec2(-1.,1.));gl_Position=vec4(p[gl_VertexID],0.,1.);}`;
  function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vsSrc));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, GLSL_F));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
  gl.useProgram(prog);
  const uT = gl.getUniformLocation(prog, 't'), uBeat = gl.getUniformLocation(prog, 'beat'),
        uRes = gl.getUniformLocation(prog, 'res'), uPtr = gl.getUniformLocation(prog, 'ptr'),
        uA = gl.getUniformLocation(prog, 'a');
  W.onTime((dt, t) => {
    beatPulse = Math.max(0, beatPulse - dt * 3);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform1f(uT, t); gl.uniform1f(uBeat, beatPulse);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform2f(uPtr, W.pointer.x, 1 - W.pointer.y);
    gl.uniform4f(uA, bands4[0], bands4[1], bands4[2], bands4[3]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  });
  return true;
}

startWebGpu().then(ok => { if (!ok && !startWebGl2()) document.body.style.background = '#1a1030'; })
  .catch(() => { if (!startWebGl2()) document.body.style.background = '#1a1030'; });
</script>
</body>
</html>
